<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>Actualizando planificador</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7fb;color:#172033;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px;box-sizing:border-box}
    main{max-width:420px;text-align:center;background:white;border:1px solid #e1e5ee;border-radius:20px;padding:28px;box-shadow:0 12px 34px rgba(30,40,60,.08)}
    h1{font-size:22px;margin:0 0 8px}p{margin:0;color:#657087;line-height:1.5}.spin{font-size:34px;margin-bottom:12px;display:block;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<main>
  <span class="spin">↻</span>
  <h1>Actualizando la app</h1>
  <p id="status">Instalando la versión nueva…</p>
</main>
<script>
(async()=>{
  const status=document.getElementById('status');
  if(!('serviceWorker' in navigator)){
    location.replace('./?v=19&nocache='+Date.now());
    return;
  }
  try{
    const reg=await navigator.serviceWorker.register('./service-worker.js',{scope:'./'});
    await reg.update();
    if(reg.waiting) reg.waiting.postMessage('SKIP_WAITING');

    await new Promise(resolve=>{
      let done=false;
      const finish=()=>{if(done)return;done=true;resolve()};
      navigator.serviceWorker.addEventListener('controllerchange',finish,{once:true});
      setTimeout(finish,2200);
    });

    status.textContent='Versión nueva instalada. Abriendo…';
    location.replace('./?v=19&nocache='+Date.now());
  }catch(err){
    status.textContent='Reintentando…';
    setTimeout(()=>location.reload(),1200);
  }
})();
</script>
</body>
</html>
