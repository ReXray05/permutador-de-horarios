name: Validate and deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          for f in src/*.js service-worker.js; do node --check "$f"; done
          python - <<'PY'
          from pathlib import Path
          import re, sys
          for p in Path('src').glob('*.js'):
              for rel in re.findall(r"from\s+['\"](\./[^'\"]+)['\"]", p.read_text()):
                  if not (p.parent/rel).resolve().exists():
                      print('Missing import',p,rel); sys.exit(1)
          print('Validation OK')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
