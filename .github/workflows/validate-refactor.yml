name: Validate refactor

on:
  push:
    branches: ["refactor-v20"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          for f in src/*.js service-worker.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Check module references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          bad=[]
          for p in Path('src').glob('*.js'):
              text=p.read_text()
              for rel in re.findall(r"from\s+['\"](\./[^'\"]+)['\"]", text):
                  target=(p.parent/rel).resolve()
                  if not target.exists(): bad.append((str(p),rel))
          if bad:
              print('Missing imports:',bad); sys.exit(1)
          html=Path('index.html').read_text()
          for required in ['weekView','monthView','shopView','missionsView','scheduleSelect','calendar','monthGrid','skinGrid','missionList','settingsBackdrop','eventModalBackdrop']:
              if f'id="{required}"' not in html:
                  print('Missing HTML id',required); sys.exit(1)
          print('Static checks OK')
          PY
      - name: Browser smoke test
        run: |
          python -m http.server 8080 >/tmp/server.log 2>&1 &
          sleep 1
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          if [ -z "$CHROME" ]; then echo "Chrome not available, skipping browser smoke test"; exit 0; fi
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=4000 --dump-dom http://127.0.0.1:8080/ > /tmp/dom.html
          grep -q 'data-skin-action="mort"' /tmp/dom.html
          grep -q 'Misión 6' /tmp/dom.html
          grep -q 'Tienda de skins' /tmp/dom.html
          grep -q 'Sistemas de Fabricación Flexible' /tmp/dom.html
          echo "Browser smoke test OK"
