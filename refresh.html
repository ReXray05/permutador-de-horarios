<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Actualizando planificador…</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7fb;color:#172033}
    .box{max-width:420px;margin:24px;padding:24px;border-radius:18px;background:#fff;box-shadow:0 14px 42px rgba(0,0,0,.08);text-align:center}
    .spinner{width:34px;height:34px;margin:0 auto 14px;border:4px solid #dfe4ef;border-top-color:#6b65e8;border-radius:50%;animation:spin .8s linear infinite}
    h1{font-size:20px;margin:0 0 8px}p{font-size:13px;line-height:1.45;color:#667085;margin:0}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-color-scheme:dark){body{background:#111318;color:#f5f7fb}.box{background:#1b1e25}p{color:#abb3c1}}
  </style>
</head>
<body>
  <main class="box">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Actualizando la app…</h1>
    <p>Voy a limpiar la versión antigua y cargar la última.</p>
  </main>
  <script>
    (async () => {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(reg => reg.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
        }
        if ('serviceWorker' in navigator) {
          await navigator.serviceWorker.register('./service-worker.js?force=19', {scope:'./', updateViaCache:'none'});
          await navigator.serviceWorker.ready;
          await new Promise(resolve => setTimeout(resolve, 900));
        }
      } catch (error) {
        console.warn('No se pudo completar toda la limpieza:', error);
      }
      location.replace('./?fresh=' + Date.now());
    })();
  </script>
</body>
</html>
